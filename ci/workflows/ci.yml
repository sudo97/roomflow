# Лабораторна робота 3: CI/CD-конвеєр RoomFlow.
# lint ─┐
# test ─┴─> build ─> docker ─> deploy-staging ─> deploy-production (лише теги v*)
name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: gofmt
        run: test -z "$(gofmt -l . | tee /dev/stderr)"
      - name: go vet
        run: go vet ./...
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.5.0

  test:
    # Індивідуальне завдання 1: матриця (3 версії Go x 2 ОС), паралельне виконання
    strategy:
      fail-fast: false
      matrix:
        go: ["1.23", "1.24", "1.25"]
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: Unit tests with race detector and coverage
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...
      - name: Coverage summary
        if: matrix.os == 'ubuntu-latest' && matrix.go == '1.24'
        run: |
          go tool cover -func=coverage.out | tee coverage.txt
          go tool cover -html=coverage.out -o coverage.html
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {print $3}')
          {
            echo "### Покриття коду тестами: $total"
            echo '```'; cat coverage.txt; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest' && matrix.go == '1.24'
        with:
          name: coverage-report
          path: |
            coverage.out
            coverage.txt
            coverage.html
          retention-days: 30

  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: ["linux/amd64", "linux/arm64", "darwin/arm64", "windows/amd64"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Build ${{ matrix.target }}
        run: |
          export GOOS=${TARGET%/*} GOARCH=${TARGET#*/} CGO_ENABLED=0
          ext=""; [ "$GOOS" = windows ] && ext=".exe"
          mkdir -p dist
          go build -trimpath -ldflags="-s -w -X main.version=${GITHUB_REF_NAME} -X main.commit=${GITHUB_SHA::7}" \
            -o "dist/roomflow-${GOOS}-${GOARCH}${ext}" ./cmd/roomflow
          ls -la dist
        env:
          TARGET: ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: roomflow-${{ strategy.job-index }}
          path: dist/
          retention-days: 7

  docker:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: echo "image=${IMAGE}:sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ env.IMAGE }}:${{ github.ref_name == 'main' && 'main' || github.ref_name }}
          build-args: |
            VERSION=${{ github.ref_name }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    # Індивідуальне завдання 2: умовне розгортання залежно від події та гілки
    needs: docker
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: http://localhost:8080
    steps:
      - uses: actions/checkout@v4
      - name: Deploy container
        run: |
          docker run -d --name roomflow -p 8080:8080 ${{ needs.docker.outputs.image }}
          sleep 2; docker ps
      - name: Smoke test
        run: bash scripts/smoke.sh http://localhost:8080 | tee smoke.txt
      - name: Rollback on failure
        if: failure()
        run: docker logs roomflow; docker rm -f roomflow; echo "::error::staging smoke test failed, deployment rolled back"
      - run: |
          echo "### Staging: ${{ needs.docker.outputs.image }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"; cat smoke.txt >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"

  deploy-production:
    needs: [docker, deploy-staging]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - uses: actions/checkout@v4
      - name: Deploy container
        run: docker run -d --name roomflow -p 8080:8080 ${{ needs.docker.outputs.image }}
      - name: Smoke test
        run: bash scripts/smoke.sh http://localhost:8080
