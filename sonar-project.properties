sonar.projectKey=roomflow
sonar.projectName=RoomFlow
sonar.sources=.
sonar.exclusions=**/*_test.go,**/vendor/**,**/testdata/**,ci/**,scripts/**,evidence/**
sonar.tests=.
sonar.test.inclusions=**/*_test.go
sonar.go.coverage.reportPaths=coverage.out
sonar.sourceEncoding=UTF-8
# sonar.host.url та sonar.token передаються через змінні середовища SONAR_HOST_URL / SONAR_TOKEN
