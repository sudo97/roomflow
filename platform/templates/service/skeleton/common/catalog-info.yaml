apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: ${{ values.name }}
  description: ${{ values.description }}
  annotations:
    backstage.io/techdocs-ref: dir:.
  tags: [${{ values.language }}, golden-path]
spec:
  type: service
  lifecycle: experimental
  owner: ${{ values.owner }}
  system: roomflow
{%- if values.database != "none" %}
  dependsOn: [resource:${{ values.name }}-${{ values.database }}]
{%- endif %}
