# Source: roomflow/templates/deployments.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rf-blue
  labels:
    app.kubernetes.io/name: roomflow
    app.kubernetes.io/instance: rf
    app.kubernetes.io/version: "v1"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: roomflow-0.3.0
    color: blue
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: roomflow
      app.kubernetes.io/instance: rf
      color: blue
  template:
    metadata:
      labels:
        app.kubernetes.io/name: roomflow
        app.kubernetes.io/instance: rf
        color: blue
        version: "v1"
      annotations:
        prometheus.io/port: "8080"
        prometheus.io/scrape: "true"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: roomflow
          image: "roomflow:v1"
          imagePullPolicy: IfNotPresent
          env:
            - { name: COLOR, value: "blue" }
            - { name: FLAGS_FILE, value: /etc/roomflow/flags/flags.json }
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 2
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          resources:
            limits:
              cpu: 500m
              memory: 128Mi
            requests:
              cpu: 50m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: flags, mountPath: /etc/roomflow/flags, readOnly: true }
      volumes:
        - name: flags
          configMap:
            name: rf-flags
