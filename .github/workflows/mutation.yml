# Лабораторна робота 4, індивідуальне завдання 4: мутаційне тестування (Gremlins).
# Логіка винесена в ci/mutation/run.sh, публікація результатів — у ci/publish-evidence.sh.
name: mutation

on:
  workflow_dispatch:
    inputs:
      refs:
        description: "Версії коду для аналізу через пробіл"
        default: "HEAD"
      threshold:
        description: "Мінімальна test efficacy пакета booking, %"
        default: "0"
  push:
    branches: [main]
    paths: ["internal/**", ".gremlins.yaml", "ci/mutation/**"]

permissions:
  contents: write

concurrency:
  group: mutation
  cancel-in-progress: false

jobs:
  gremlins:
    runs-on: ubuntu-latest
    env:
      REFS: ${{ inputs.refs || 'HEAD' }}
      THRESHOLD: ${{ inputs.threshold || '0' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: go install github.com/go-gremlins/gremlins/cmd/gremlins@latest
      - name: Unleash the gremlins
        run: bash ci/mutation/run.sh "$REFS" | tee /tmp/mutation.log
      - name: Summary
        if: always()
        run: |
          d=/tmp/evidence/$(git rev-parse --short HEAD)
          { echo "### Gremlins ($(git rev-parse --short HEAD))"; echo '```'; cat "$d/summary.tsv" "$d/survivors.tsv"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Efficacy gate (booking)
        run: |
          eff=$(jq -r '.test_efficacy' /tmp/evidence/$(git rev-parse --short HEAD)/gremlins-booking.json)
          echo "booking test efficacy: $eff% (threshold $THRESHOLD%)"
          awk -v e="$eff" -v t="$THRESHOLD" 'BEGIN { exit !(e >= t) }'
      - name: Publish evidence
        if: always()
        run: bash ci/publish-evidence.sh lab4-mutation
