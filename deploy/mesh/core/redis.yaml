# ЛР12, завдання 1: сервіс кешування Redis з персистентністю (AOF на PersistentVolumeClaim).
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: redis-data, namespace: rf-mesh }
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 1Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: redis, namespace: rf-mesh, labels: { app: redis } }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: redis } }
  template:
    metadata: { labels: { app: redis, version: "7.4" } }
    spec:
      serviceAccountName: redis
      securityContext: { runAsNonRoot: true, runAsUser: 999, runAsGroup: 999, fsGroup: 999, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: redis
          image: redis:7.4-alpine
          args: ["--appendonly", "yes", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
          ports: [{ name: tcp-redis, containerPort: 6379 }]
          readinessProbe: { exec: { command: [redis-cli, ping] }, periodSeconds: 5 }
          livenessProbe: { tcpSocket: { port: 6379 }, periodSeconds: 10 }
          resources: { requests: { cpu: 20m, memory: 32Mi }, limits: { cpu: 300m, memory: 128Mi } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          volumeMounts: [{ name: data, mountPath: /data }]
      volumes: [{ name: data, persistentVolumeClaim: { claimName: redis-data } }]
---
apiVersion: v1
kind: Service
metadata: { name: redis, namespace: rf-mesh }
spec:
  selector: { app: redis }
  ports: [{ name: tcp-redis, port: 6379 }]
