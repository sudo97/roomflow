# Jaeger all-in-one: приймає OTLP від sidecar-ів Envoy (gRPC 4317) і від застосунків (HTTP 4318).
apiVersion: apps/v1
kind: Deployment
metadata: { name: jaeger, namespace: istio-system }
spec:
  selector: { matchLabels: { app: jaeger } }
  template:
    metadata:
      labels: { app: jaeger }
      annotations: { sidecar.istio.io/inject: "false" }
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.62.0
          env: [{ name: COLLECTOR_OTLP_ENABLED, value: "true" }, { name: SPAN_STORAGE_TYPE, value: memory }]
          resources: { limits: { memory: 512Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: jaeger-collector, namespace: istio-system }
spec:
  selector: { app: jaeger }
  ports:
    - { name: grpc-otlp, port: 4317 }
    - { name: http-otlp, port: 4318 }
---
apiVersion: v1
kind: Service
metadata: { name: tracing, namespace: istio-system }
spec:
  selector: { app: jaeger }
  ports: [{ name: http-query, port: 16686 }]
---
# Політика семплювання: 100% у навчальному стенді (у production — 1–10% або tail-based sampling у Collector).
apiVersion: telemetry.istio.io/v1
kind: Telemetry
metadata: { name: mesh-default, namespace: istio-system }
spec:
  tracing:
    - providers: [{ name: otel }]
      randomSamplingPercentage: 100
