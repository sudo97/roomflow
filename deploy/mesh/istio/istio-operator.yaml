# Istio: трасування через OpenTelemetry (Jaeger), доступ до заголовків трасування в застосунку.
apiVersion: install.istio.io/v1alpha1
kind: IstioOperator
spec:
  profile: default
  meshConfig:
    enableTracing: true
    accessLogFile: /dev/stdout
    extensionProviders:
      - name: otel
        opentelemetry:
          service: jaeger-collector.istio-system.svc.cluster.local
          port: 4317
  components:
    ingressGateways:
      - name: istio-ingressgateway
        enabled: true
        k8s:
          service: { type: ClusterIP }
