global:
  scrape_interval: 5s
  scrape_timeout: 4s
  evaluation_interval: 5s
  external_labels: { cluster: ci }

rule_files:
  - /etc/prometheus/recording.rules.yml
  - /etc/prometheus/alerts.rules.yml

alerting:
  alertmanagers:
    - static_configs: [{ targets: ["alertmanager:9093"] }]

scrape_configs:
  - job_name: roomflow
    static_configs: [{ targets: ["roomflow:8080"], labels: { service: roomflow } }]
  - job_name: dora
    static_configs: [{ targets: ["dora-exporter:9102"] }]
  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]
  - job_name: loki
    static_configs: [{ targets: ["loki:3100"] }]
  - job_name: alertmanager
    static_configs: [{ targets: ["alertmanager:9093"] }]
